[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "engineering-scribe"
version = "1.0.0"
description = "Turn accepted Git pushes into factual, idempotent Discord engineering updates"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rai" }]
dependencies = []

[project.scripts]
engineering-scribe = "engineering_scribe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
